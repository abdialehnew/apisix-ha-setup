[server]
# Protocol (http, https, socket)
protocol = http
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(port)s/

[security]
# Allow embedding Grafana in iframes
allow_embedding = true

# Set SameSite cookie attribute (None, Lax, Strict)
cookie_samesite = none

# Set secure cookie flag
cookie_secure = false

# Secret key for signing cookies
secret_key = SW2YcwTIb9zpOOhoPsMm

# Disable Content Security Policy to allow iframe embedding
content_security_policy = false

# Allow all frame ancestors (for embedding)
# In production, specify exact domains: "http://your-domain.com http://another-domain.com"
content_security_policy_report_only = false

# Disable X-Frame-Options header
x_frame_options = ""

[auth.anonymous]
# Enable anonymous access
enabled = true

# Organization name that should be used for anonymous users
org_name = Main Org.

# Role for anonymous users (Viewer, Editor, Admin)
org_role = Viewer

[auth]
# Disable login form if you want anonymous only
# disable_login_form = false
# disable_signout_menu = false

[panels]
# Allow panel embedding
disable_sanitize_html = false

[users]
# Allow users to create organizations
allow_org_create = true
# Default organization role for new users
default_theme = dark

[log]
mode = console
level = info

[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning
