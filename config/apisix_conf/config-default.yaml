deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  etcd:
    host:
      - "http://etcd1:2379"
      - "http://etcd2:2379"
      - "http://etcd3:2379"
    prefix: /apisix
    timeout: 30

apisix:
  node_listen: 9080
  enable_admin: true
  enable_admin_cors: true
  enable_control: true
  control:
    ip: 0.0.0.0
    port: 9092
