networks:
  apisix-network:
    driver: bridge

volumes:
  etcd1-data:
  etcd2-data:
  etcd3-data:

services:
  # ETCD Cluster for HA
  etcd1:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: apisix-etcd1
    restart: always
    networks:
      - apisix-network
    volumes:
      - etcd1-data:/etcd-data
      - ./data/etcd1:/backup
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name=etcd1
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://etcd1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd2:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: apisix-etcd2
    restart: always
    networks:
      - apisix-network
    volumes:
      - etcd2-data:/etcd-data
      - ./data/etcd2:/backup
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name=etcd2
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://etcd2:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  etcd3:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: apisix-etcd3
    restart: always
    networks:
      - apisix-network
    volumes:
      - etcd3-data:/etcd-data
      - ./data/etcd3:/backup
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
      - --name=etcd3
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --advertise-client-urls=http://etcd3:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=etcd-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # APISIX Instance 1
  apisix1:
    image: apache/apisix:latest
    container_name: apisix-node1
    restart: always
    networks:
      - apisix-network
    ports:
      - "9180:9080"    # Data plane
      - "9280:9180"    # Admin API
      - "9543:9443"
    environment:
      - APISIX_STAND_ALONE=false
      - APISIX_ADMIN_KEY=${APISIX_ADMIN_KEY}
      - APISIX_VIEWER_KEY=${APISIX_VIEWER_KEY}
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["docker-start"]
    volumes:
      - ./config/apisix_conf/apisix-entrypoint.sh:/custom-entrypoint.sh:ro
      - ./logs/apisix1:/usr/local/apisix/logs
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/9080 && echo -e 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'APISIX' <&3\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # APISIX Instance 2
  apisix2:
    image: apache/apisix:latest
    container_name: apisix-node2
    restart: always
    networks:
      - apisix-network
    ports:
      - "9181:9080"    # Data plane
      - "9281:9180"    # Admin API
      - "9544:9443"
    environment:
      - APISIX_STAND_ALONE=false
      - APISIX_ADMIN_KEY=${APISIX_ADMIN_KEY}
      - APISIX_VIEWER_KEY=${APISIX_VIEWER_KEY}
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["docker-start"]
    volumes:
      - ./config/apisix_conf/apisix-entrypoint.sh:/custom-entrypoint.sh:ro
      - ./logs/apisix1:/usr/local/apisix/logs
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/9080 && echo -e 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'APISIX' <&3\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # APISIX Instance 3
  apisix3:
    image: apache/apisix:latest
    container_name: apisix-node3
    restart: always
    networks:
      - apisix-network
    ports:
      - "9182:9080"    # Data plane
      - "9282:9180"    # Admin API
      - "9545:9443"
    environment:
      - APISIX_STAND_ALONE=false
      - APISIX_ADMIN_KEY=${APISIX_ADMIN_KEY}
      - APISIX_VIEWER_KEY=${APISIX_VIEWER_KEY}
    entrypoint: ["/custom-entrypoint.sh"]
    command: ["docker-start"]
    volumes:
      - ./config/apisix_conf/apisix-entrypoint.sh:/custom-entrypoint.sh:ro
      - ./logs/apisix3:/usr/local/apisix/logs
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/9080 && echo -e 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'APISIX' <&3\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # APISIX Dashboard
  apisix-dashboard:
    image: apache/apisix-dashboard:latest
    container_name: apisix-dashboard
    restart: always
    networks:
      - apisix-network
    ports:
      - "9000:9000"
    environment:
      - APISIX_DASHBOARD_ETCD_ENDPOINTS=http://etcd1:2379,http://etcd2:2379,http://etcd3:2379
    volumes:
      - ./config/dashboard_conf/conf.yaml:/usr/local/apisix-dashboard/conf/conf.yaml:ro
      - ./logs/dashboard:/usr/local/apisix-dashboard/logs
    depends_on:
      - etcd1
      - etcd2
      - etcd3
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET / HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | head -1 | grep -q '200'\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # Load Balancer (HAProxy) for APISIX nodes
  haproxy:
    image: haproxy:latest
    container_name: apisix-haproxy
    restart: always
    networks:
      - apisix-network
    ports:
      - "8070:80"
      - "7443:443"
      - "8404:8404"  # HAProxy stats
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./logs/haproxy:/var/log/haproxy
    depends_on:
      - apisix1
      - apisix2
      - apisix3
    healthcheck:
      test: ["CMD", "haproxy", "-c", "-f", "/usr/local/etc/haproxy/haproxy.cfg"]
      interval: 10s
      timeout: 5s
      retries: 5
